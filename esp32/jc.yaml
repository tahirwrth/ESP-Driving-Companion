captive_portal:
    
spi:
  id: display_qspi
  type: quad
  clk_pin: 9
  data_pins: [11, 12, 13, 14]

i2c:
  sda: 7
  scl: 8
  id: touchscreen_bus

display:
  - platform: mipi_spi
    id: main_display
    bus_mode: quad
    spi_id: display_qspi
    model: JC3636W518V2
    data_rate: 40MHz
    rotation: 180
    dimensions:
      height: 360
      width: 360
    auto_clear_enabled: false
    invert_colors: true 
    color_order: rgb
    lambda: |-
      int current_page = id(my_ble_remote).get_page();
      
      // page 0 - media player

      if (current_page == 0) {
          uint16_t *buffer = id(my_ble_remote).get_display_buffer();
          if (buffer != nullptr) {
            for (int y = 0; y < 360; y++) {
              for (int x = 0; x < 360; x++) {
                uint16_t p = buffer[y * 360 + x];
                uint8_t r = ((p >> 11) & 0x1F) << 3;
                uint8_t g = ((p >> 5) & 0x3F) << 2;
                uint8_t b = (p & 0x1F) << 3;
                it.draw_pixel_at(x, y, Color(r, g, b));
              }
            }
          }

          float progress = id(my_ble_remote).get_progress();
          if (progress > 0.0f) {
            int cx = 180;
            int cy = 180;
            float start_angle = -1.5708f; 
            float end_angle = start_angle + (progress * 6.2832f);
            
            for (float a = start_angle; a <= end_angle; a += 0.005f) {
              for (int r = 172; r <= 175; r++) {
                int px = cx + (int)(r * cos(a));
                int py = cy + (int)(r * sin(a));
                it.draw_pixel_at(px, py, Color::WHITE);
              }
            }
          }
      } 

      // page 1 - navigation

      else if (current_page == 1) {
          // background alert colours
          if (id(my_ble_remote).get_alert_active()) {
              it.fill(Color(0, 0, 150)); 
              it.printf(180, 35, id(font_small), TextAlign::CENTER, "POLICE / HAZARD AHEAD!");
          } else {
              it.fill(Color::BLACK);
          }
          
          // text header
          it.printf(180, 65, id(font_medium), TextAlign::CENTER, "%s", id(my_ble_remote).get_nav_turn().c_str());
          
          // graphics canvas for arrows
          std::string turn_type = id(my_ble_remote).get_nav_turn();
          Color arrow_color = Color::WHITE;
          
          if (turn_type == "STRAIGHT") {
              for(int i = -3; i <= 3; i++) {
                  it.line(180 + i, 195, 180 + i, 120, arrow_color); // Stem
                  it.line(180, 120, 165 + i, 140, arrow_color);     // Left Head
                  it.line(180, 120, 195 + i, 140, arrow_color);     // Right Head
              }
          }
          else if (turn_type == "LEFT") {
              for(int i = -3; i <= 3; i++) {
                  it.line(180 + i, 195, 180 + i, 155, arrow_color); // Upward stem
                  it.line(180, 155 + i, 135, 155 + i, arrow_color); // Leftward bend
                  it.line(135, 155, 155, 135 + i, arrow_color);     // Upper arrow edge
                  it.line(135, 155, 155, 175 + i, arrow_color);     // Lower arrow edge
              }
          }
          else if (turn_type == "RIGHT") {
              for(int i = -3; i <= 3; i++) {
                  it.line(180 + i, 195, 180 + i, 155, arrow_color); // Upward stem
                  it.line(180, 155 + i, 225, 155 + i, arrow_color); // Rightward bend
                  it.line(225, 155, 205, 135 + i, arrow_color);     // Upper arrow edge
                  it.line(225, 155, 205, 175 + i, arrow_color);     // Lower arrow edge
              }
          }
          else if (turn_type == "KEEP L") {
              for(int i = -3; i <= 3; i++) {
                  it.line(180 + i, 195, 145 + i, 130, arrow_color); // Angled Left Stem
                  it.line(145, 130, 145, 155 + i, arrow_color);     // Head down
                  it.line(145, 130, 170 + i, 130, arrow_color);     // Head right
              }
          }
          else if (turn_type == "KEEP R") {
              for(int i = -3; i <= 3; i++) {
                  it.line(180 + i, 195, 215 + i, 130, arrow_color); // Angled Right Stem
                  it.line(215, 130, 215, 155 + i, arrow_color);     // Head down
                  it.line(215, 130, 190 + i, 130, arrow_color);     // Head left
              }
          }
          else if (turn_type == "U-TURN") {
              for(int i = -3; i <= 3; i++) {
                  it.line(195 + i, 195, 195 + i, 145, arrow_color); // Right rising side
                  it.line(195, 145 + i, 165, 145 + i, arrow_color); // Top horizontal bridge
                  it.line(165 + i, 145, 165 + i, 175, arrow_color); // Left dropping side
                  it.line(165, 175, 150 + i, 155, arrow_color);     // Arrow barb left
                  it.line(165, 175, 180 + i, 155, arrow_color);     // Arrow barb right
              }
          }
          else if (turn_type == "ROUND") {
              // Vector Roundabout Ring
              for(int r = 22; r <= 27; r++) {
                  it.circle(180, 155, r, arrow_color);
              }
              // Bottom Entry Vector
              for(int i = -3; i <= 3; i++) {
                  it.line(180 + i, 195, 180 + i, 182, arrow_color);
              }
              // Universal exit marker at top structure out from ring
              for(int i = -3; i <= 3; i++) {
                  it.line(180 + i, 128, 180 + i, 110, arrow_color); // Exit path
                  it.line(180, 110, 168 + i, 125, arrow_color);     // Left cap
                  it.line(180, 110, 192 + i, 125, arrow_color);     // Right cap
              }
          }
          
          // data dashboard below graphics
          it.printf(180, 240, id(font_medium), TextAlign::CENTER, "%s", id(my_ble_remote).get_nav_dist().c_str());
          
          std::string exit_num = id(my_ble_remote).get_nav_exit();
          if (exit_num.length() > 0) {
              it.printf(180, 285, id(font_small), TextAlign::CENTER, "Exit %s", exit_num.c_str());
              it.printf(180, 320, id(font_small), TextAlign::CENTER, "%s", id(my_ble_remote).get_nav_street().c_str());
          } else {
              it.printf(180, 295, id(font_small), TextAlign::CENTER, "%s", id(my_ble_remote).get_nav_street().c_str());
          }
      }

output:
  - platform: ledc
    pin: GPIO15
    id: backlight

light:
  - platform: monochromatic
    output: backlight
    name: "backlight Light" 
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: cst816
    id: my_touch
    interrupt_pin: GPIO41
    reset_pin: GPIO40
    on_touch:
      - lambda: |-
          // raw touch co-ords into ble_remote
          id(my_ble_remote).handle_touch(touch.x, touch.y);